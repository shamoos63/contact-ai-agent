services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      # Defaults to the Ollama container; set OLLAMA_URL in .env to use the Ollama app on this computer instead.
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      DATA_DIR: /data
      # The search engine the assistant uses for online questions (the searxng service below).
      SEARXNG_URL: ${SEARXNG_URL:-http://searxng:8080}
      OLLAMA_MODELS_PATH: the "ollama-models" folder inside your contact-ai-agent project folder
    volumes:
      - ./data:/data
    depends_on:
      - ollama
      - searxng

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      # Model files live next to the project so they are easy to back up or copy to another computer.
      - ./ollama-models:/root/.ollama/models
    environment:
      OLLAMA_KEEP_ALIVE: 24h
      # One reply at a time, and keep both the chat and the search model loaded, so neither has to
      # be reloaded from disk between messages.
      OLLAMA_NUM_PARALLEL: 1
      OLLAMA_MAX_LOADED_MODELS: 2
    # For an NVIDIA graphics card, start with docker-compose.gpu.yml as well (see README).

  # Free search engine for the assistant's online questions. Only reachable from inside Docker.
  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    environment:
      SEARXNG_BASE_URL: http://searxng:8080/

  # Optional: public HTTPS address for the Facebook/Instagram webhooks.
  # Start with: docker compose --profile tunnel up -d   (then see the logs for the URL)
  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://app:3000
    depends_on:
      - app
