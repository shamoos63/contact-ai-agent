services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      OLLAMA_URL: http://ollama:11434
      DATA_DIR: /data
      OLLAMA_MODELS_PATH: the "ollama-models" folder inside your contact-ai-agent project folder
    volumes:
      - ./data:/data
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      # Model files live next to the project so they are easy to back up or copy to another computer.
      - ./ollama-models:/root/.ollama/models
    environment:
      OLLAMA_KEEP_ALIVE: 24h
    # For an NVIDIA graphics card, start with docker-compose.gpu.yml as well (see README).

  # Optional: public HTTPS address for the Facebook/Instagram webhooks.
  # Start with: docker compose --profile tunnel up -d   (then see the logs for the URL)
  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://app:3000
    depends_on:
      - app
